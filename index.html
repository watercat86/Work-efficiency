<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eee9; --panel:#f6f9f6; --ink:#17302c; --sub:#5b706b;
  --line:#17302c; --accent:#2b55ff; --mark:#ffd84a;
  --disp:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10201d; --panel:#172b27; --ink:#e6f0ea; --sub:#93aaa3; --line:#e6f0ea; --accent:#8aa2ff;}
}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;background-blend-mode:normal}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.93;z-index:-1}
main{max-width:960px;margin:0 auto;padding:clamp(2rem,6vw,5rem) 1.25rem 3rem}

header{margin-bottom:3.5rem}
h1{font-family:var(--disp);font-weight:400;font-size:clamp(2.6rem,10vw,5.6rem);line-height:1.05;margin:0;letter-spacing:-.01em}
h1 .br{color:var(--accent)}
h1 .cursor{display:inline-block;width:.45em;height:.9em;background:var(--mark);vertical-align:-.1em;margin-left:.12em;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
header p{max-width:34em;color:var(--sub);margin:1.2rem 0 0;font-size:1.05rem}

section{margin-bottom:3rem}
h2{font-family:var(--disp);font-weight:400;font-size:1.25rem;margin:0 0 1rem;display:flex;align-items:center;gap:.75rem}
h2 .tag{color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{display:flex;flex-direction:column;gap:.5rem;padding:1.1rem 1.2rem 1rem;background:var(--panel);
  border:2px solid var(--line);color:inherit;text-decoration:none;border-radius:4px 18px 4px 4px;
  box-shadow:5px 5px 0 var(--line);transition:transform .12s,box-shadow .12s}
.card:hover,.card:focus-visible{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--line)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.card .icon{font-size:1.8rem;line-height:1}
.card .name{font-family:var(--disp);font-size:1.15rem;line-height:1.3;margin:0}
.card .desc{margin:0;color:var(--sub);font-size:.92rem;flex:1}
.card .url{font-size:.8rem;color:var(--accent);word-break:break-all;margin:0}
.card .badge{font-size:.72rem;font-weight:700;background:var(--mark);color:#17302c;padding:.05rem .5rem;border-radius:99px;white-space:nowrap}
.card.todo{border-style:dashed;box-shadow:none;background:transparent}
.card.todo .url{color:var(--sub)}

footer{border-top:2px solid var(--line);padding-top:1rem;color:var(--sub);font-size:.85rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.card,h1 .cursor{transition:none;animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1><span class="br">&lt;</span>HTML<br>Workbench<span class="br">&gt;</span><span class="cursor"></span></h1>
    <p>HTMLを書く作業をラクにするための道具箱。自分用だけど、よかったらご自由にどうぞ。</p>
  </header>

  <div id="app"></div>

  <footer>
    <span id="count"></span>
    <span>© <span id="year"></span> watercat86 / <a href="https://github.com/watercat86/Work-efficiency">GitHub</a></span>
  </footer>
</main>

<script>
const GROUPS = [
  {
    title: "ツール",
    items: [
      { icon:"🎮", name:"Parts Rig Editor", desc:"キャラクターのスプライトを図形で組み立て、関節を設定するエディタ", url:"parts-rig-editor/" },
      { icon:"🎵", name:"Sonic Forge", desc:"ビジュアル編集で8bit～ゲーム効果音、BGMを簡単に作成できるDAW", url:"sonic-forge/" },
      { icon:"✏️", name:"準備中", desc:"ここに一言説明を書く", url:"" },
    ]
  },
  {
    title: "サンプル集",
    items: [
      { icon:"🧹", name:"準備中", desc:"ここに一言説明を書く", url:"" },
      { icon:"🔧", name:"準備中", desc:"ここに一言説明を書く", url:"" },
      { icon:"🎨", name:"準備中", desc:"ここに一言説明を書く", url:"" },
    ]
  },
  {
    title: "リファレンス・ドキュメント",
    items: [
      { icon:"🔍", name:"準備中", desc:"ここに一言説明を書く", url:"" },
      { icon:"📱", name:"準備中", desc:"ここに一言説明を書く", url:"" },
      { icon:"📚", name:"準備中", desc:"ここに一言説明を書く", url:"" },
    ]
  }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let total = 0;

document.getElementById("app").innerHTML = GROUPS.map(g => `
  <section>
    <h2><span class="tag">&lt;${esc(g.title)}&gt;</span></h2>
    <div class="grid">
      ${g.items.map(t => {
        total++;
        const ready = !!t.url;
        const open = ready ? `a href="${esc(t.url)}" rel="noopener"` : `div`;
        const close = ready ? "a" : "div";
        return `<${open} class="card${ready ? "" : " todo"}">
          <div class="top"><span class="icon" aria-hidden="true">${esc(t.icon)}</span>${t.badge ? `<span class="badge">${esc(t.badge)}</span>` : ""}</div>
          <h3 class="name">${esc(t.name)}</h3>
          <p class="desc">${esc(t.desc)}</p>
          <p class="url">${ready ? esc(t.url.replace(/^https?:\/\//, "")) : "準備中"}</p>
        </${close}>`;
      }).join("")}
    </div>
  </section>`).join("");

document.getElementById("count").textContent = `${total} tools`;
document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
